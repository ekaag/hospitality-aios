# Azurite, Microsoft's Azure Storage emulator, for the Blob Storage adapter's contract tests (K3). CI starts it; locally,
# with Docker:
#
#   docker compose -f tests/emulators/azurite/compose.yaml up -d
#
# then set HOSPITALITYOS_AZURITE=UseDevelopmentStorage=true. Only the blob service runs; each test makes and deletes its
# own container. The API version check is skipped so a newer SDK than the emulator knows still works.
name: hospitalityos-azurite

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 # 3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    ports:
      - "10000:10000"
