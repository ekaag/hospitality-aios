# The Azure Service Bus emulator, for the Service Bus adapter's contract tests (K2). CI starts it; locally, with Docker:
#
#   ACCEPT_EULA=Y MSSQL_SA_PASSWORD='<a strong password>' docker compose -f tests/emulators/servicebus/compose.yaml up -d
#
# then set HOSPITALITYOS_SERVICEBUS and HOSPITALITYOS_SERVICEBUS_ADMIN as ci.yml does. ACCEPT_EULA=Y accepts the licence
# terms of the emulator (https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt) and
# of SQL Server Developer edition, which the emulator stores its state in. Config.json declares only a placeholder
# queue: each test creates the topic or queue it uses through the administration client (port 5300) and deletes it.
name: hospitalityos-servicebus-emulator

services:
  emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3 # 2.0.1
    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD to a strong password for the throwaway SQL Server.}
      ACCEPT_EULA: ${ACCEPT_EULA:?Set ACCEPT_EULA=Y to accept the emulator and SQL Server licence terms.}
      SQL_WAIT_INTERVAL: "30"
    depends_on:
      - sql

  sql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718 # 2022-latest on 2026-10-31
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD to a strong password for the throwaway SQL Server.}
      ACCEPT_EULA: ${ACCEPT_EULA:?Set ACCEPT_EULA=Y to accept the emulator and SQL Server licence terms.}
