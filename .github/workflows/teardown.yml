# Tears an environment down by automation (implementation plan §5.1, P12): its plan's resources in reverse order, then
# empty resource groups. Stateful resources (vaults, later databases and storage) stay unless asked for. The environment
# name must be typed again, and the job runs under that environment's protection rules.
name: teardown

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to tear down.
        required: true
        type: choice
        options: [dev]
      confirm:
        description: Type the environment name again.
        required: true
      plan:
        description: The deployment plan it was deployed with.
        required: false
        default: azure-only
      include-stateful:
        description: Also delete stateful resources (vaults, databases, storage).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  teardown:
    name: Tear down ${{ inputs.environment }}
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Tear down
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          PLAN: ${{ inputs.plan }}
          STATEFUL: ${{ inputs.include-stateful && '--include-stateful' || '' }}
        # STATEFUL is either empty or one flag, so it is left unquoted on purpose.
        run: python3 deploy/tooling/deploy.py down --env "${ENVIRONMENT}" --plan "${PLAN}" --confirm "${CONFIRM}" ${STATEFUL}
