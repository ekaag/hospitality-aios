# Daily drift detection (implementation plan §5.1, P12): a what-if of dev's plan against what is deployed, keeping the
# deployed image. Any change means something was altered outside the pipeline, or the templates moved on and were not
# deployed; the run fails and opens an issue.
name: drift-detection

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      plan:
        description: The deployment plan (deploy/plans).
        required: false
        default: azure-only

permissions:
  contents: read

jobs:
  dev:
    name: Drift (dev)
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against what is deployed
        env:
          PLAN: ${{ inputs.plan || 'azure-only' }}
        run: python3 deploy/tooling/deploy.py drift --env dev --plan "${PLAN}" --report "${RUNNER_TEMP}/drift.md"

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${GITHUB_REPOSITORY}" --title "Drift in dev" --body-file "${RUNNER_TEMP}/drift.md"
