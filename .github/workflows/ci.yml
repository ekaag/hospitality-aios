# Continuous integration: build, style, and all test suites on every PR and push (implementation plan Â§5.1, slice A4).
# Port contract tests (C1) and AI evals against the Fake model (H3) run with the other suites; the frontends (J1) have their own job.
# The spec §43 demo runs in a browser against the real API and apps (L2) in a job of its own.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  dotnet:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The PostgreSQL adapter's contract and migration tests (K1) run against a real server; each test makes and drops its
    # own database. The Service Bus adapter's (K2) and the Blob Storage adapter's (K3) run against the Service Bus emulator
    # and Azurite, started below once the repository (and their configuration) is checked out; each test makes and deletes
    # its own topic, queue, or container. The passwords guard nothing: the servers live only for this job.
    services:
      postgres:
        image: postgres@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f # postgres:17 on 2026-10-31
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOSPITALITYOS_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      HOSPITALITYOS_SERVICEBUS: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      HOSPITALITYOS_SERVICEBUS_ADMIN: Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      # Here the servers must be there: their tests fail rather than skip.
      HOSPITALITYOS_POSTGRES_REQUIRED: "true"
      HOSPITALITYOS_SERVICEBUS_REQUIRED: "true"
      HOSPITALITYOS_AZURITE: UseDevelopmentStorage=true
      HOSPITALITYOS_AZURITE_REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Started first so it boots while .NET builds; the tests wait for it to answer.
      - name: Start the Service Bus emulator
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-throwaway-1
        run: docker compose -f tests/emulators/servicebus/compose.yaml up -d

      - name: Start Azurite
        run: docker compose -f tests/emulators/azurite/compose.yaml up -d

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Wait for the Service Bus emulator
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5300/health > /dev/null 2>&1; then
              echo "Emulator ready after ${attempt} checks."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Service Bus emulator did not become healthy."
          exit 1

      - name: Wait for Azurite
        run: |
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:10000/; then
              echo "Azurite ready after ${attempt} checks."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Azurite did not start."
          exit 1

      - name: Test (architecture, unit, port contract on InMemory, file system, SQLite, PostgreSQL, Service Bus, and Azurite, integration, AI evals on the Fake model)
        run: dotnet test --no-build --configuration Release --report-xunit-trx --results-directory TestResults

      - name: Service Bus emulator logs
        if: failure()
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-throwaway-1
        run: docker compose -f tests/emulators/servicebus/compose.yaml logs emulator

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  frontend:
    name: Frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from apps/package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The .NET suite checks openapi.json is what the API describes; this checks the client is generated from it.
      - name: Verify the client matches the API contract
        run: |
          pnpm generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  demo:
    name: Demo in the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up pnpm (version from apps/package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @hospitalityos/e2e exec playwright install --with-deps chromium

      # The spec §43 demo through the guest and staff apps, against the real API with the Aurora Grand seeded (L2).
      - name: Run the demo
        run: pnpm --filter @hospitalityos/e2e e2e

      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
